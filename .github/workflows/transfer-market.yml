name: Transfer market check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Persists the token cache and last-seen market snapshot across runs
      # so `watch --once` can diff against the previous run instead of
      # treating every run as a fresh baseline.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kickbase
          key: kickbase-state-${{ github.run_id }}
          restore-keys: kickbase-state-
      - name: Fetch transfer market
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASSWORD: ${{ secrets.KICKBASE_PASSWORD }}
          KICKBASE_LEAGUE_ID: ${{ secrets.KICKBASE_LEAGUE_ID }}
        run: python -m kickbase.cli watch --once
      # Same 15-minute cron this workflow already runs on - this just adds
      # a second diff (notable new listings, see strategy.is_notable_listing,
      # plus your own bids placed/updated/won/lost, see _track_my_bids) that
      # actually pushes somewhere, instead of only logging to the Action's
      # own output like the step above.
      - name: Alert on notable new listings and bid status
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASSWORD: ${{ secrets.KICKBASE_PASSWORD }}
          KICKBASE_LEAGUE_ID: ${{ secrets.KICKBASE_LEAGUE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m kickbase.cli alert --telegram
