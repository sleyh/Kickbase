name: Daily transfer spending analysis

# 8pm Europe/Berlin - before the ~10pm daily market-value recalculation
# (see squad-value.yml), so this reflects the same day's transfers before
# that day's value update recolors everyone's "current value" premium
# calculation. GitHub Actions cron is fixed UTC with no DST awareness -
# hour 18 is correct for CEST (UTC+2). Once Germany switches to CET
# (UTC+1) in autumn, shift this back by one hour to 17 to keep firing at
# the same local time (same caveat as brief.yml/squad-value.yml).
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: {}

jobs:
  transfer-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kickbase
          key: kickbase-state-${{ github.run_id }}
          restore-keys: kickbase-state-
      - name: Send daily transfer spending analysis
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASSWORD: ${{ secrets.KICKBASE_PASSWORD }}
          KICKBASE_LEAGUE_ID: ${{ secrets.KICKBASE_LEAGUE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m kickbase.cli transfer-analysis --telegram
