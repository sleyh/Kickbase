name: Briefing

# 6am/10am/2pm/6pm/8pm/midnight Europe/Berlin. GitHub Actions cron is
# fixed UTC with no DST awareness - these hours (4,8,12,16,18,22) are
# correct for CEST (UTC+2, roughly late March - late October). Once
# Germany switches to CET (UTC+1) in autumn, shift every hour here back
# by one to keep firing at the same local times.
on:
  schedule:
    - cron: "0 4,8,12,16,18,22 * * *"
  workflow_dispatch: {}

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kickbase
          key: kickbase-state-${{ github.run_id }}
          restore-keys: kickbase-state-
      - name: Run briefing
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASSWORD: ${{ secrets.KICKBASE_PASSWORD }}
          KICKBASE_LEAGUE_ID: ${{ secrets.KICKBASE_LEAGUE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m kickbase.cli brief --telegram
