name: Team bot

# Schedule paused: rolled back from live autonomous trading to an
# advisory-only briefing for now (see report.py). The bot code and this
# workflow stay in place for when live automation is turned back on -
# re-add the `schedule:` trigger below to resume it.
on:
  workflow_dispatch: {}

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kickbase
          key: kickbase-state-${{ github.run_id }}
          restore-keys: kickbase-state-
      - name: Run bot (lineup, sell, bid)
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASSWORD: ${{ secrets.KICKBASE_PASSWORD }}
          KICKBASE_LEAGUE_ID: ${{ secrets.KICKBASE_LEAGUE_ID }}
        run: python -m kickbase.cli bot
