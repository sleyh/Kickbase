<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fal Image Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: control column left, result gallery right; stacks on phones */
:root {
  --bg: #f3f4f6; --panel: #ffffff; --fg: #15171c; --muted: #5d6270;
  --line: #d9dce3; --accent: #3b3fd8; --accent-fg: #ffffff; --danger: #b42318;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111318; --panel: #1a1d24; --fg: #e9ebf0; --muted: #9298a6;
    --line: #2c303a; --accent: #8c8fff; --accent-fg: #0f1020; --danger: #ff8a7a; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
.wrap { max-width: 1200px; margin: 0 auto; padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 380px 1fr; gap: 24px; align-items: start; }
@media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
h1 { font: 600 28px/1.1 var(--display); margin: 0 0 4px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 16px; }
label { display: grid; gap: 6px; font-size: 13px; font-weight: 500; }
.hint { font-weight: 400; color: var(--muted); font-size: 12px; }
input, select, textarea { font: 14px var(--body); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; width: 100%; }
textarea { min-height: 120px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--mono); font-size: 13px; }
.field { display: grid; gap: 8px; }
.lbl { font-size: 13px; font-weight: 500; }
.chips { display: grid; gap: 10px; }
.group { display: grid; gap: 6px; }
.gname { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.gchips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 13px var(--body); background: var(--bg); color: var(--fg); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 11px; cursor: pointer; }
.chip[aria-checked="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
button { font: 500 15px var(--body); background: var(--accent); color: var(--accent-fg); border: 0;
  border-radius: 6px; padding: 11px 14px; cursor: pointer; }
button:disabled { opacity: .55; cursor: progress; }
.status { font-family: var(--mono); font-size: 12px; color: var(--muted); min-height: 18px; overflow-wrap: anywhere; }
.status.err { color: var(--danger); }
.gallery { display: grid; gap: 16px; min-width: 0; }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 48px 20px; text-align: center; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.card img { display: block; width: 100%; height: auto; }
.meta { padding: 12px 14px; display: grid; gap: 4px; font-size: 13px; }
.meta .p { overflow-wrap: anywhere; }
.meta .tags { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.meta a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <section>
    <h1>fal Image Studio</h1>
    <p class="sub">Text-to-image across fal.ai models.</p>
    <form class="panel" id="form">
      <label>API key <span class="hint">Stored only in this browser.</span>
        <input id="key" type="password" class="mono" placeholder="xxxxxxxx-xxxx-…:xxxxxxxx" autocomplete="off">
      </label>
      <div class="field">
        <div class="lbl">Model <span class="hint" id="modelId"></span></div>
        <input type="hidden" id="model" value="fal-ai/nano-banana-2">
        <div id="chips" class="chips" role="radiogroup" aria-label="Model"></div>
      </div>
      <label id="customWrap" hidden>Custom model ID
        <input id="custom" class="mono" placeholder="fal-ai/your-model">
      </label>
      <label>Prompt
        <textarea id="prompt">A vinyl record on a wooden turntable, warm evening light, shallow depth of field</textarea>
      </label>
      <div class="row">
        <label>Safety checker <span class="hint">enable_safety_checker</span>
          <select id="checker">
            <option value="true">On</option>
            <option value="false" selected>Off</option>
            <option value="">Don't send</option>
          </select>
        </label>
        <label>Safety tolerance <span class="hint">safety_tolerance, 6 = loosest</span>
          <select id="tolerance">
            <option value="">Don't send</option>
            <option>1</option><option>2</option><option>3</option>
            <option>4</option><option>5</option><option selected>6</option>
          </select>
        </label>
      </div>
      <div id="sends" class="status"></div>
      <button id="go" type="submit">Generate</button>
      <div id="status" class="status" role="status"></div>
    </form>
  </section>
  <section class="gallery" id="gallery">
    <div class="empty" id="empty">Generated images appear here, newest first.</div>
  </section>
</div>
<script>
const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} }
};
$("key").value = store.get("falKey");
const MODELS = [
  ["Google", [["Nano Banana 2", "fal-ai/nano-banana-2"], ["Nano Banana 2.1", "google/nano-banana-2.1"],
              ["Nano Banana Pro", "fal-ai/nano-banana-pro"], ["Nano Banana", "fal-ai/nano-banana"]]],
  ["OpenAI", [["GPT Image 2", "openai/gpt-image-2"]]],
  ["Black Forest Labs", [["FLUX 3", "blackforestlabs/flux-3/text-to-image"], ["FLUX.2 max", "fal-ai/flux-2-max"],
              ["FLUX.2 pro", "fal-ai/flux-2-pro"], ["FLUX.2 klein", "fal-ai/flux-2/klein/9b"],
              ["FLUX.1 schnell", "fal-ai/flux/schnell"], ["FLUX1.1 ultra", "fal-ai/flux-pro/v1.1-ultra"]]],
  ["ByteDance", [["Seedream 5 Pro", "bytedance/seedream/v5/pro/text-to-image"],
              ["Seedream 4.5", "fal-ai/bytedance/seedream/v4.5/text-to-image"]]],
  ["More", [["Grok Imagine", "xai/grok-imagine-image"], ["Ideogram V3", "fal-ai/ideogram/v3"],
              ["Recraft V4 Pro", "fal-ai/recraft/v4/pro/text-to-image"], ["Qwen Image 2 Pro", "fal-ai/qwen-image-2/pro/text-to-image"],
              ["Krea 2 Large", "krea/v2/large/text-to-image"], ["Z-Image Turbo", "fal-ai/z-image/turbo"],
              ["Custom…", "custom"]]]
];
// Which safety fields each model accepts (from fal's API schemas). tol = highest safety_tolerance allowed, 0 = field not supported.
const SAFETY = {
  "fal-ai/nano-banana-2": { checker: false, tol: 6 },
  "google/nano-banana-2.1": { checker: false, tol: 6 },
  "fal-ai/nano-banana-pro": { checker: false, tol: 6 },
  "fal-ai/nano-banana": { checker: false, tol: 6 },
  "fal-ai/flux-2-max": { checker: true, tol: 5 },
  "fal-ai/flux-2-pro": { checker: true, tol: 5 },
  "fal-ai/flux-pro/v1.1-ultra": { checker: false, tol: 6 },
  "fal-ai/flux/schnell": { checker: true, tol: 0 },
  "fal-ai/bytedance/seedream/v4.5/text-to-image": { checker: true, tol: 0 },
  "bytedance/seedream/v5/pro/text-to-image": { checker: true, tol: 0 },
  "fal-ai/z-image/turbo": { checker: true, tol: 0 },
  "fal-ai/qwen-image-2/pro/text-to-image": { checker: true, tol: 0 }
};
function safetyInput(model) {
  const out = {}, s = SAFETY[model];
  const chk = $("checker").value, tol = $("tolerance").value;
  if (chk !== "" && (!s || s.checker)) out.enable_safety_checker = chk === "true";
  if (tol !== "" && (!s || s.tol)) out.safety_tolerance = String(s ? Math.min(+tol, s.tol) : tol);
  return out;
}
function currentModel() {
  return $("model").value === "custom" ? $("custom").value.trim().replace(/^\/+|\/+$/g, "") : $("model").value;
}
function syncSends() {
  const m = currentModel(), sends = safetyInput(m);
  const parts = Object.entries(sends).map(([k, v]) => `${k}=${v}`);
  const known = SAFETY[m] ? "" : " (unverified model, sent as set)";
  $("sends").textContent = "Sends: " + (parts.length ? parts.join(", ") : "no safety fields") + known;
}
const syncCustom = () => {
  const v = $("model").value;
  $("customWrap").hidden = v !== "custom";
  $("modelId").textContent = v === "custom" ? "" : v;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-checked", c.dataset.id === v));
  syncSends();
};
["checker", "tolerance", "custom"].forEach(id => $(id).addEventListener("input", syncSends));
for (const [name, list] of MODELS) {
  const g = document.createElement("div"); g.className = "group";
  const h = document.createElement("div"); h.className = "gname"; h.textContent = name;
  const row = document.createElement("div"); row.className = "gchips";
  for (const [label, id] of list) {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip";
    b.textContent = label; b.dataset.id = id; b.setAttribute("role", "radio");
    b.addEventListener("click", () => { $("model").value = id; store.set("falModel", id); syncCustom(); });
    row.append(b);
  }
  g.append(h, row); $("chips").append(g);
}
const savedModel = store.get("falModel");
if (savedModel && MODELS.some(([, l]) => l.some(([, id]) => id === savedModel))) $("model").value = savedModel;
$("custom").value = store.get("falCustom");
syncCustom();

function setStatus(msg, err=false){ $("status").textContent = msg; $("status").className = "status" + (err ? " err" : ""); }
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function falFetch(url, key, opts={}) {
  const headers = { "Authorization": "Key " + key };
  if (opts.body) headers["Content-Type"] = "application/json";
  const res = await fetch(url, { ...opts, headers });
  const text = await res.text();
  let data; try { data = JSON.parse(text); } catch { data = text; }
  if (!res.ok) {
    const detail = typeof data === "object" ? JSON.stringify(data.detail ?? data) : data;
    throw new Error(`HTTP ${res.status}: ${detail}`);
  }
  return data;
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const key = $("key").value.trim();
  const model = $("model").value === "custom" ? $("custom").value.trim().replace(/^\/+|\/+$/g, "") : $("model").value;
  const prompt = $("prompt").value.trim();
  if (!key) return setStatus("Add your fal.ai API key first.", true);
  if (!model) return setStatus("Enter a model ID.", true);
  if (!prompt) return setStatus("Write a prompt first.", true);
  store.set("falKey", key); store.set("falModel", $("model").value); store.set("falCustom", $("custom").value);

  const input = { prompt, ...safetyInput(model) };

  $("go").disabled = true;
  const t0 = performance.now();
  try {
    setStatus(`Queuing ${model}…`);
    const job = await falFetch(`https://queue.fal.run/${model}`, key, { method: "POST", body: JSON.stringify(input) });
    let st;
    do {
      await sleep(1000);
      st = await falFetch(job.status_url, key);
      const pos = st.queue_position != null ? ` (position ${st.queue_position})` : "";
      setStatus(`${st.status}${pos} · ${((performance.now()-t0)/1000).toFixed(0)}s`);
    } while (st.status === "IN_QUEUE" || st.status === "IN_PROGRESS");
    const out = await falFetch(job.response_url, key);
    const images = out.images || (out.image ? [out.image] : []);
    if (!images.length) throw new Error("No images in response: " + JSON.stringify(out).slice(0, 300));
    const nsfw = out.has_nsfw_concepts || [];
    images.forEach((img, i) => addCard(img.url, model, prompt, input, nsfw[i]));
    setStatus(`Done in ${((performance.now()-t0)/1000).toFixed(1)}s`);
  } catch (err) {
    const net = /Failed to fetch|Load failed|NetworkError/i.test(err.message);
    setStatus(net ? "Network error: this page couldn't reach fal.ai. Check your connection and try again." : err.message, true);
  } finally { $("go").disabled = false; }
});

function addCard(url, model, prompt, input, flagged) {
  $("empty").hidden = true;
  const card = document.createElement("article"); card.className = "card";
  const img = document.createElement("img"); img.src = url; img.alt = prompt; img.loading = "lazy";
  const meta = document.createElement("div"); meta.className = "meta";
  const p = document.createElement("div"); p.className = "p"; p.textContent = prompt;
  const tags = document.createElement("div"); tags.className = "tags";
  tags.textContent = [model,
    "checker=" + (input.enable_safety_checker ?? "–"),
    "tolerance=" + (input.safety_tolerance ?? "–"),
    flagged ? "flagged NSFW" : null].filter(Boolean).join(" · ");
  const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Open full size";
  meta.append(p, tags, a); card.append(img, meta);
  $("gallery").prepend(card);
}
</script>
</body>
</html>
